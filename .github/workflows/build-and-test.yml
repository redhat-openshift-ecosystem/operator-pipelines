---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tox:
    name: ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tox-env: [test, black, yamllint, bandit, mypy, pylint, ansible-lint, agents-md]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up poetry
        uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
        with:
          poetry-version: "2.3.1"

      - name: Install non-python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run ${{ matrix.tox-env }}
        run: |
          poetry run tox -e ${{ matrix.tox-env }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for poetry.lock changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: poetry.lock

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up poetry
        uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
        with:
          poetry-version: "2.3.1"

      - name: Install non-python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run pip-audit
        continue-on-error: ${{ steps.changed-files.outputs.any_changed != 'true' }}
        run: |
          poetry run tox -e pip-audit

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install tox
        run: pip install tox

      - name: Install Hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          tox -e hadolint

  build:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Set variables
        id: set-vars
        run: |
          COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF_NAME" == "main" ]]; then
            echo "tags=latest $COMMIT_SHA" >> $GITHUB_OUTPUT
          else
            echo "tags=$COMMIT_SHA" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: operator-pipelines-images
          tags: ${{ steps.set-vars.outputs.tags }}
          dockerfiles: |
            ./Dockerfile

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io/redhat-isv
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Print image url
        run: echo "Image pushed to ${{ steps.push-to-quay.outputs.registry-paths }}"

  integration-tests:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.label.name == 'ready-for-testing'
    timeout-minutes: 90
    strategy:
      matrix:
        test_type:
          - isv
          - community
          - isv-fbc-bundle
          - isv-fbc-catalog

      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare
        id: prepare
        run: |
          COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          echo "suffix=${COMMIT_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          # Install python packages needed from ansible
          # TODO: pipx inject --force with kubernetes==35.0.0: forces the pin over any
          # existing venv deps; temporary workaround for v36.0.0 auth breakage until
          # kubernetes/collection is compatible.
          pipx inject --force ansible-core jmespath openshift pygithub 'kubernetes==35.0.0'

          # Add certificates to trusted list
          sudo cp  certs/* /usr/local/share/ca-certificates
          # Rename all .pem files to .crt to allow update-ca-certificates
          for file in /usr/local/share/ca-certificates/*.pem
          do
            sudo mv "$file" "${file%.pem}.crt"
          done
          sudo update-ca-certificates

          echo "${{ secrets.VAULT_PASSWORD }}" > "$HOME"/.vault-password

          # secret used also in hosted pipeline for enabling
          # access to cluster for tkn command log accessing
          mkdir -p "$HOME"/.kube
          ansible-vault decrypt \
            --vault-password-file "$HOME"/.vault-password \
            --output "$HOME"/.kube/config \
            ansible/vaults/integration-tests/ci-pipeline-kubeconfig

          # secret used also in hosted pipeline for enabling
          # cloning of the repository
          mkdir -p "$HOME"/.ssh
          ansible-vault decrypt \
            --vault-password-file "$HOME"/.vault-password \
            --output "$HOME"/.ssh/id_rsa \
            ansible/vaults/integration-tests/ci-pipeline-github-ssh-key

      - name: Run the integration tests ansible playbook
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: playbooks/operator-pipeline-integration-tests.yml
          directory: ./ansible
          requirements: playbooks/requirements.yml
          vault_password: ${{secrets.VAULT_PASSWORD}}
          options: |
            -e "test_type=${{ matrix.test_type }}"
            -e "oc_namespace=int-tests-${{ matrix.test_type }}-${{ github.run_number }}-${{ github.run_attempt }}"
            -e "integration_tests_operator_bundle_version=0.2.${{ github.run_number }}-${{ github.run_attempt }}"
            -e "operator_pipeline_image_tag=${{ github.event.pull_request.head.sha || github.sha }}"
            -e "suffix=${{ steps.prepare.outputs.suffix }}"
            -e "ansible_python_interpreter=/opt/pipx/venvs/ansible-core/bin/python3"
            --skip-tags=signing-pipeline
            -v
