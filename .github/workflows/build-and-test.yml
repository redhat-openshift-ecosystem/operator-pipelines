---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tox:
    name: ${{ matrix.tox-env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tox-env: [test, black, yamllint, bandit, mypy, pylint, ansible-lint, agents-md]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up poetry
        uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
        with:
          poetry-version: "2.3.1"

      - name: Install non-python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run ${{ matrix.tox-env }}
        run: |
          poetry run tox -e ${{ matrix.tox-env }}

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check for poetry.lock changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: poetry.lock

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up poetry
        uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec # v9
        with:
          poetry-version: "2.3.1"

      - name: Install non-python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Run pip-audit
        continue-on-error: ${{ steps.changed-files.outputs.any_changed != 'true' }}
        run: |
          poetry run tox -e pip-audit

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install tox
        run: pip install tox

      - name: Install Hadolint
        env:
          version: v2.14.0
          hadolint_sha256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/download/${version}/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          echo "${hadolint_sha256}  /usr/local/bin/hadolint" | sha256sum -c -
          chmod +x /usr/local/bin/hadolint

      - name: Run hadolint
        run: |
          tox -e hadolint

  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and push
        uses: ./.github/actions/build-arch
        with:
          arch: amd64
          # https://github.com/operator-framework/operator-registry/releases (linux-amd64-opm)
          opm_sha256: a9c9193dd727a11966f98919a4805328554c439d3f7e72a095b4eb4a437dcd9f
          # https://mirror.openshift.com/pub/openshift-v4/amd64/clients/ocp/4.20.35/
          oc_sha256: 35ce9f9a21d1524f811f035b730aa0b51879df73343fb3d59d618b88b0f1b968
          # https://github.com/operator-framework/operator-sdk/releases (operator-sdk_linux_amd64)
          operator_sdk_sha256: 25872268c422fb63a350d85741a1f26052c953c7e9654167b0e8dbd6dbfb6c1d
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  build-arm64:
    name: Build (arm64)
    # Only on push to the default branch.
    if: >
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and push
        uses: ./.github/actions/build-arch
        with:
          arch: arm64
          # https://github.com/operator-framework/operator-registry/releases (linux-arm64-opm)
          opm_sha256: de3d6fb55c83376c3b890ce751b819823dc7c4bf4506c04bc781c67989fad88c
          # https://mirror.openshift.com/pub/openshift-v4/arm64/clients/ocp/4.20.35/
          oc_sha256: 34ee513227e6b828ff902671998ad6ea4cfaebdd40fa52d17d3a6accc6f99e96
          # https://github.com/operator-framework/operator-sdk/releases (operator-sdk_linux_arm64)
          operator_sdk_sha256: f21905486df9f28892d7a6a25bab6ccd341ecbc204d35a1c1c175e973b734f25
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}

  publish:
    name: Create and push manifest
    needs: [build-amd64, build-arm64]
    # Continue when build-arm64 is skipped; default needs would skip publish too.
    if: >
      !cancelled() &&
      needs.build-amd64.result == 'success' &&
      (needs.build-arm64.result == 'success' || needs.build-arm64.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        id: set-vars
        run: |
          COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${{ needs.build-arm64.result }}" == "success" ]]; then
            echo "extra_tags=latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra_tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Podman Login
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create and push manifest
        env:
          IMAGE: quay.io/redhat-isv/operator-pipelines-images
          COMMIT_SHA: ${{ steps.set-vars.outputs.commit_sha }}
          EXTRA_TAGS: ${{ steps.set-vars.outputs.extra_tags }}
          ARCHES: ${{ needs.build-arm64.result == 'success' && 'amd64 arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          MANIFEST="${IMAGE}:${COMMIT_SHA}"
          buildah manifest create "${MANIFEST}"
          for arch in ${ARCHES}; do
            buildah manifest add "${MANIFEST}" "${IMAGE}:${COMMIT_SHA}-linux-${arch}"
          done
          podman manifest push --all "${MANIFEST}" "${MANIFEST}"
          for tag in ${EXTRA_TAGS}; do
            podman manifest push --all "${MANIFEST}" "${IMAGE}:${tag}"
          done
          echo "Manifest pushed to ${MANIFEST} (arches: ${ARCHES})"
          if [[ -n "${EXTRA_TAGS}" ]]; then
            echo "Also tagged as: ${EXTRA_TAGS}"
          fi

  integration-tests:
    needs: [publish]
    # Continue when build-arm64 is skipped; default needs would skip this job too.
    # Use !cancelled() rather than always() so a cancelled run still stops here.
    if: >
      !cancelled() &&
      needs.publish.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.label.name == 'ready-for-testing')
    timeout-minutes: 90
    strategy:
      matrix:
        test_type:
          - isv
          - community
          - isv-fbc-bundle
          - isv-fbc-catalog

      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare
        id: prepare
        run: |
          COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          echo "suffix=${COMMIT_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          # Install python packages needed from ansible
          # TODO: pipx inject --force with kubernetes==35.0.0: forces the pin over any
          # existing venv deps; temporary workaround for v36.0.0 auth breakage until
          # kubernetes/collection is compatible.
          pipx inject --force ansible-core jmespath openshift pygithub 'kubernetes==35.0.0'

          # Add certificates to trusted list
          sudo cp  certs/* /usr/local/share/ca-certificates
          # Rename all .pem files to .crt to allow update-ca-certificates
          for file in /usr/local/share/ca-certificates/*.pem
          do
            sudo mv "$file" "${file%.pem}.crt"
          done
          sudo update-ca-certificates

          echo "${{ secrets.VAULT_PASSWORD }}" > "$HOME"/.vault-password

          # secret used also in hosted pipeline for enabling
          # access to cluster for tkn command log accessing
          mkdir -p "$HOME"/.kube
          ansible-vault decrypt \
            --vault-password-file "$HOME"/.vault-password \
            --output "$HOME"/.kube/config \
            ansible/vaults/integration-tests/ci-pipeline-kubeconfig

          # secret used also in hosted pipeline for enabling
          # cloning of the repository
          mkdir -p "$HOME"/.ssh
          ansible-vault decrypt \
            --vault-password-file "$HOME"/.vault-password \
            --output "$HOME"/.ssh/id_rsa \
            ansible/vaults/integration-tests/ci-pipeline-github-ssh-key

      - name: Run the integration tests ansible playbook
        uses: dawidd6/action-ansible-playbook@126642a1c6ce512da255ef2b41e8ee90f0077474 # v9
        with:
          playbook: playbooks/operator-pipeline-integration-tests.yml
          directory: ./ansible
          requirements: playbooks/requirements.yml
          vault_password: ${{secrets.VAULT_PASSWORD}}
          options: |
            -e "test_type=${{ matrix.test_type }}"
            -e "oc_namespace=int-tests-${{ matrix.test_type }}-${{ github.run_number }}-${{ github.run_attempt }}"
            -e "integration_tests_operator_bundle_version=0.2.${{ github.run_number }}-${{ github.run_attempt }}"
            -e "operator_pipeline_image_tag=${{ github.event.pull_request.head.sha || github.sha }}"
            -e "suffix=${{ steps.prepare.outputs.suffix }}"
            -e "ansible_python_interpreter=/opt/pipx/venvs/ansible-core/bin/python3"
            --skip-tags=signing-pipeline
            -v
