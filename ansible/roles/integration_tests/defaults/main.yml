---
# Branch containing the source operator bundle to copy
integration_tests_src_operator_git_branch: main

# The branch representing the upstream/base state to copy
integration_tests_git_base_branch: main

# Replace the source bundle's version
integration_tests_operator_bundle_version: 0.0.1

integration_tests_fbc_lfs: false
integration_tests_fbc_lfs_target_size: 100000001
integration_tests_fbc_lfs_run_id: ""
integration_tests_fbc_lfs_branch_suffix: >-
  {% if integration_tests_fbc_lfs | bool %}-lfs-{{ integration_tests_fbc_lfs_run_id }}{% endif %}

# Copy the bundle into this branch. LFS test runs get a unique suffix so they
# can run concurrently without sharing branches or PipelineRun selectors.
integration_tests_git_bundle_branch: >-
  {{ integration_tests_operator_package_name }}-{{ integration_tests_operator_bundle_version }}{{ integration_tests_fbc_lfs_branch_suffix }}-head

# Raise pull requests against this upstream branch
integration_tests_git_upstream_branch: >-
  {{ integration_tests_operator_package_name }}-{{ integration_tests_operator_bundle_version }}{{ integration_tests_fbc_lfs_branch_suffix }}-base
